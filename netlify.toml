# 弓道帳 — Netlify 設定
# ビルド不要の静的サイトとして、リポジトリのルートをそのまま公開する。

[build]
  publish = "."
  command = ""

# JS / CSS は更新がすぐ反映されるよう、キャッシュせず毎回確認させる
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
